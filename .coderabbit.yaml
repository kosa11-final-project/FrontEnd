# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json

# 프론트엔드 PR 리뷰 코멘트는 팀이 읽기 쉬운 한국어로 남깁니다.
language: 'ko-KR'
early_access: false

reviews:
  profile: 'chill'
  request_changes_workflow: false
  high_level_summary: true
  review_status: true
  auto_review:
    enabled: false
    labels:
      - 'coderabbit-review'
    drafts: false
    auto_incremental_review: true
  path_filters:
    - '!dist/**'
    - '!storybook-static/**'
    - '!test-results/**'
    - '!coverage/**'
    - '!node_modules/**'
  path_instructions:
    - path: 'src/**'
      instructions: |
        이 저장소는 React 19 + Vite 기반 JavaScript 프론트엔드입니다.
        다음 기준을 기존 코드와 문서에 맞춰 리뷰하세요.
        - FSD-lite 계층 의존성 app -> pages -> widgets -> features -> entities -> shared를 지키고, 하위 계층이 상위 계층을 참조하지 않는지 확인합니다.
        - 페이지·위젯·피처에서 Axios를 직접 import하지 않고 shared/api와 TanStack Query 경계를 지키는지 확인합니다.
        - API 응답 mapper, URL 상태, 서버 상태, 전역 UI 상태의 소유권이 프론트엔드 개발 규칙과 일치하는지 확인합니다.
        - 적용 가능한 loading, empty, error, forbidden 상태와 접근성 이름·키보드 포커스·모바일 레이아웃을 확인합니다.
        - 새 공통 UI·variant·재사용 컴포넌트가 Storybook 상태와 함께 갱신되어야 하는지 확인합니다.
        - 기존 디자인 토큰을 우선 사용하고, 하드코딩 색상·아이콘 라이브러리 혼용·불필요한 의존성 추가를 지적합니다.
        - 실제 백엔드 계약이 확정되지 않은 영역을 추측으로 구현하지 않았는지 확인합니다.

    - path: 'src/shared/ui/**'
      instructions: |
        공유 UI primitive를 리뷰할 때는 도메인 로직이 섞이지 않았는지, label·ARIA 이름·키보드 포커스·disabled 상태가 제공되는지 확인합니다.
        기존 semantic design token과 공통 variant를 우선 사용하고, 공통 컴포넌트 변경에 필요한 Storybook 상태가 있는지 확인합니다.

    - path: 'src/**/*.test.js'
      instructions: |
        Vitest 테스트는 외부 네트워크나 시간·환경에 의존하지 않고 결정적이어야 합니다.
        순수 도메인 규칙·mapper·formatter·query key의 정상 경로뿐 아니라 빈 값, 경계값, 오류 경로를 확인하세요.

    - path: 'tests/**'
      instructions: |
        Playwright 테스트는 실제 사용자 흐름과 라우팅을 검증해야 합니다.
        역할 기반 locator와 명시적인 대기를 우선하고, 구현 세부 class나 취약한 sleep에 의존하지 않는지 확인하세요.

    - path: 'package.json'
      instructions: |
        이 프로젝트는 Node.js 24 LTS와 pnpm 11.18.0을 사용합니다.
        새 의존성이 실제로 필요한지, pnpm-lock.yaml과 함께 갱신되었는지, 기존 검증 명령을 우회하는 script가 추가되지 않았는지 확인하세요.

chat:
  auto_reply: true
  allow_non_org_members: false
  integrations:
    jira:
      usage: 'enabled'

knowledge_base:
  jira:
    usage: 'enabled'
    project_keys:
      - 'YSK'
  code_guidelines:
    enabled: true
    filePatterns:
      - files: 'docs/development-conventions.md, docs/frontend-foundation-team-guide.md, docs/team-frontend-handbook.md, .github/pull_request_template.md'
        applyTo: 'src/**/*.{js,jsx,css}, tests/**/*.js, *.config.js, *.config.jsx, package.json, .github/**/*.yml'
